name: 🐛 Bug Report
description: Create a detailed report to help us reproduce and fix a bug in Book2Skills.
title: "[BUG]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have checked existing issues before creating a new report.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to consistently reproduce the behavior.
      placeholder: |
        1. Run command 'book2skills run pipeline sample.pdf'
        2. Set provider to '...'
        3. See error in logs...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen vs. what actually occurred?
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python Version
      options:
        - "3.11"
        - "3.12"
        - "3.13+"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "Windows"
        - "Linux (Ubuntu/Debian)"
        - "Linux (Other)"
        - "macOS"
    validations:
      required: true

  - type: dropdown
    id: llm-provider
    attributes:
      label: LLM Provider Used
      options:
        - "Ollama (Local)"
        - "OpenAI (GPT-4o)"
        - "Anthropic (Claude 3.5)"
        - "Google Gemini"
        - "DeepSeek"
        - "OpenRouter"
        - "Other / None"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs & Traceback
      description: Please paste relevant terminal log output or tracebacks here.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, configuration snippets, or screenshots about the problem.
